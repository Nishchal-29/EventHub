<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage your event registrations.">
    <title>My Registrations — EventHub</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=5">
</head>
<body>
    <main class="main-content" role="main">
        <div class="container">
            <div id="flash-container" class="flash-container"></div>
            <div class="page-header">
                <h1>My Registrations</h1>
                <p>Manage your upcoming and past event registrations</p>
            </div>

            <div class="tabs" role="tablist">
                <button class="tab active" id="tab-upcoming" data-tab="upcoming" role="tab" aria-selected="true">
                    Upcoming <span class="tab-count">0</span>
                </button>
                <button class="tab" id="tab-past" data-tab="past" role="tab" aria-selected="false">
                    Past <span class="tab-count">0</span>
                </button>
            </div>

            <div id="registrations-content" aria-live="polite">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <script src="/assets/js/common.js?v=5"></script>
    <script src="/assets/js/my-registrations.js?v=5"></script>
</body>
</html>
