<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin dashboard for managing events and attendees.">
    <title>Admin Dashboard — EventHub</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>
    <main class="main-content" role="main">
        <div class="container">
            <div class="page-header">
                <h1>Admin Dashboard</h1>
                <p>Manage events, view attendees, and track registrations</p>
            </div>

            <div class="stat-cards">
                <div class="card stat-card">
                    <div class="stat-value" id="stat-total">—</div>
                    <div class="stat-label">Total Events</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value" id="stat-upcoming">—</div>
                    <div class="stat-label">Upcoming</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value" id="stat-registrations">—</div>
                    <div class="stat-label">Total Registrations</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value" id="stat-full">—</div>
                    <div class="stat-label">Full Events</div>
                </div>
            </div>

            <div class="admin-header">
                <h2>Events</h2>
                <button class="btn btn-primary" id="btn-create-event">+ Create Event</button>
            </div>

            <div class="table-wrapper">
                <table class="data-table" id="admin-events-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Registrations</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-events-body">
                        <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/assets/js/common.js?v=4"></script>
    <script src="/assets/js/admin.js?v=4"></script>
</body>
</html>
