# Apache VirtualHost for Event Registration Portal (XAMPP on Windows, port 8080)
# Add this to C:\xampp\apache\conf\extra\httpd-vhosts.conf

<VirtualHost *:8080>
    ServerName eventportal.local
    ServerAlias localhost
    DocumentRoot "C:/Users/ASUS/Documents/Sem 5/Web Dev Lab/Event Registration System/public"

    <Directory "C:/Users/ASUS/Documents/Sem 5/Web Dev Lab/Event Registration System/public">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Block direct access to includes, sql, scripts outside DocumentRoot
    <Directory "C:/Users/ASUS/Documents/Sem 5/Web Dev Lab/Event Registration System/includes">
        Require all denied
    </Directory>
    <Directory "C:/Users/ASUS/Documents/Sem 5/Web Dev Lab/Event Registration System/sql">
        Require all denied
    </Directory>
    <Directory "C:/Users/ASUS/Documents/Sem 5/Web Dev Lab/Event Registration System/scripts">
        Require all denied
    </Directory>

    ErrorLog "logs/eventportal-error.log"
    CustomLog "logs/eventportal-access.log" combined
</VirtualHost>
